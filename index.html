<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dominated By Carl | Official Links</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="shortcut icon" type="image/jpeg" href="favicon.jpg">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body { min-height:100%; width:100%; }

    body {
      min-height:100svh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
      background:#060000;
      color:#fff;
      overflow-x:hidden;
      padding:40px 16px;
    }

    .bg-layer {
      position:fixed; inset:0; z-index:0;
      background:
        radial-gradient(ellipse 90% 55% at 10% -5%, rgba(200,0,0,0.2) 0%, transparent 65%),
        radial-gradient(ellipse 70% 50% at 92% 105%, rgba(150,0,0,0.16) 0%, transparent 65%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(25,0,0,0.85) 0%, #060000 100%);
    }

    #ember-canvas {
      position:fixed; inset:0; z-index:1; pointer-events:none;
    }

    /* ── CARD ── */
    .container {
      position:relative; z-index:10;
      width:100%; max-width:460px;
      text-align:center;
      padding:48px 30px 38px;
      background:
        linear-gradient(150deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.01) 45%, transparent 100%),
        rgba(8,0,0,0.6);
      border:1px solid rgba(255,80,80,0.22);
      border-radius:30px;
      backdrop-filter:blur(32px) saturate(170%) brightness(1.05);
      -webkit-backdrop-filter:blur(32px) saturate(170%) brightness(1.05);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 1.5px 0 0 rgba(255,200,200,0.13) inset,
        0 -1px 0 0 rgba(0,0,0,0.6) inset,
        0 0 50px rgba(255,10,10,0.14),
        0 0 120px rgba(180,0,0,0.07),
        0 50px 90px rgba(0,0,0,0.85);
    }

    .container::before {
      content:'';
      position:absolute; top:0; left:20px; right:20px; height:1px;
      background:linear-gradient(90deg, transparent, rgba(255,160,160,0.45), transparent);
      border-radius:100%;
    }

    /* ── PROFILE ── */
    .profile-wrap {
      position:relative; display:inline-block; margin-bottom:24px;
    }

    .ring-spin {
      position:absolute; inset:-5px; border-radius:50%; z-index:0;
      background:conic-gradient(from 0deg, #ff0000, #ff5500, #ffcc00, #ff0000, #cc0000, #ff0000);
      animation:spin 5s linear infinite;
    }

    .ring-blur {
      position:absolute; inset:-14px; border-radius:50%; z-index:0;
      background:radial-gradient(circle, rgba(255,30,30,0.35) 0%, transparent 70%);
      animation:pulse-ring 3s ease-in-out infinite;
    }

    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes pulse-ring {
      0%,100% { transform:scale(1); opacity:0.7; }
      50% { transform:scale(1.18); opacity:1; }
    }

    .profile-image {
      position:relative; z-index:1;
      width:130px; height:130px;
      object-fit:cover; border-radius:50%;
      border:3px solid #080000;
      display:block;
    }

    /* ── NAME ── */
    h1 {
      font-size:clamp(1.5rem, 5.5vw, 2.1rem);
      font-weight:900;
      letter-spacing:0.05em;
      text-transform:uppercase;
      background:linear-gradient(135deg, #ffffff 10%, #ffaaaa 55%, #ff2222 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      margin-bottom:8px; line-height:1.1;
    }

    .description {
      color:rgba(255,160,160,0.5);
      margin-bottom:34px;
      font-size:0.88rem; letter-spacing:0.06em; text-transform:uppercase;
    }

    /* ── LINKS ── */
    .links { display:flex; flex-direction:column; gap:13px; }

    .link {
      text-decoration:none; color:#fff;
      padding:16px 22px;
      border-radius:18px;
      font-size:1rem; font-weight:700; letter-spacing:0.025em;
      position:relative; overflow:hidden;
      display:flex; align-items:center; justify-content:center; gap:12px;
      transition:transform 0.22s cubic-bezier(0.34,1.56,0.64,1),
                  box-shadow 0.22s ease,
                  filter 0.22s ease;
      /* glass base */
      backdrop-filter:blur(12px) saturate(140%);
      -webkit-backdrop-filter:blur(12px) saturate(140%);
    }

    /* top shine bead */
    .link::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:52%;
      background:linear-gradient(180deg, rgba(255,255,255,0.13) 0%, transparent 100%);
      border-radius:18px 18px 0 0;
      pointer-events:none;
    }

    /* bottom depth */
    .link::after {
      content:'';
      position:absolute; bottom:0; left:0; right:0; height:40%;
      background:linear-gradient(0deg, rgba(0,0,0,0.22) 0%, transparent 100%);
      border-radius:0 0 18px 18px;
      pointer-events:none;
    }

    .link:hover {
      transform:translateY(-5px) scale(1.025);
      filter:brightness(1.18);
    }
    .link:active { transform:translateY(-2px) scale(1.01); }

    /* Twitch */
    .twitch {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%),
        linear-gradient(135deg, rgba(55,25,90,0.92), rgba(130,60,255,0.88));
      border:1px solid rgba(145,70,255,0.35);
      box-shadow:0 4px 24px rgba(100,30,255,0.22), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .twitch:hover { box-shadow:0 20px 50px rgba(100,30,255,0.4), 0 0 0 1px rgba(255,255,255,0.06) inset; }

    /* YouTube */
    .youtube {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%),
        linear-gradient(135deg, rgba(90,0,0,0.92), rgba(220,0,0,0.9));
      border:1px solid rgba(255,50,50,0.38);
      box-shadow:0 4px 24px rgba(220,0,0,0.28), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .youtube:hover { box-shadow:0 20px 50px rgba(255,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06) inset; }

    /* Instagram */
    .instagram {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%),
        linear-gradient(135deg, rgba(80,20,120,0.92), rgba(200,30,90,0.88), rgba(240,120,20,0.85));
      border:1px solid rgba(220,80,120,0.32);
      box-shadow:0 4px 24px rgba(180,30,100,0.25), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .instagram:hover { box-shadow:0 20px 50px rgba(200,40,120,0.42), 0 0 0 1px rgba(255,255,255,0.06) inset; }

    /* ── SVG ICONS ── */
    .link-icon {
      width:22px; height:22px;
      flex-shrink:0; display:flex; align-items:center; justify-content:center;
    }
    .link-icon svg { width:22px; height:22px; fill:#fff; }

    /* ── FOOTER ── */
    .footer {
      margin-top:30px; font-size:0.7rem;
      color:rgba(255,80,80,0.2);
      letter-spacing:0.1em; text-transform:uppercase;
    }

    /* ── ORBS ── */
    .orb {
      position:fixed; border-radius:50%;
      pointer-events:none; filter:blur(90px); z-index:0;
    }
    .orb-1 {
      width:520px; height:520px;
      background:rgba(190,0,0,0.13);
      top:-220px; left:-200px;
      animation:orb-drift 13s ease-in-out infinite alternate;
    }
    .orb-2 {
      width:440px; height:440px;
      background:rgba(110,0,0,0.11);
      bottom:-180px; right:-160px;
      animation:orb-drift 16s ease-in-out infinite alternate-reverse;
    }
    @keyframes orb-drift {
      0% { transform:translate(0,0); }
      100% { transform:translate(45px,45px); }
    }

    @media (max-width:480px) {
      .container { padding:36px 18px 30px; border-radius:24px; }
      .profile-image { width:110px; height:110px; }
      .link { padding:15px 16px; font-size:0.92rem; }
    }

    @media (prefers-reduced-motion:reduce) {
      .ring-spin, .ring-blur, .orb { animation:none; }
    }
  </style>
</head>
<body>

<script>
  const canvas = document.getElementById('ember-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, embers = [];
  const COUNT = 100;

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  function rand(a, b) { return a + Math.random() * (b - a); }

  class Ember {
    constructor(fromBottom) { this.reset(fromBottom); }
    reset(fromBottom) {
      this.x = rand(0, W);
      this.y = fromBottom ? H + rand(10, 60) : rand(-60, H);
      this.vx = rand(-0.55, 0.55);
      this.vy = rand(-2.4, -0.7);
      this.size = rand(1.2, 3.6);
      this.alpha = rand(0.45, 1);
      this.decay = rand(0.003, 0.008);
      this.wobble = rand(0, Math.PI * 2);
      this.wobbleSpeed = rand(0.02, 0.055);
      this.wobbleAmp = rand(0.2, 0.85);
      const t = Math.random();
      if (t < 0.12) { this.r=255; this.g=245; this.b=190; }
      else if (t < 0.42) { this.r=255; this.g=rand(70,150); this.b=15; }
      else { this.r=255; this.g=rand(8,55); this.b=0; }
    }
    update() {
      this.wobble += this.wobbleSpeed;
      this.x += this.vx + Math.sin(this.wobble) * this.wobbleAmp;
      this.y += this.vy;
      this.alpha -= this.decay;
      this.size *= 0.999;
    }
    draw() {
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      const g = ctx.createRadialGradient(this.x,this.y,0, this.x,this.y,this.size*4);
      g.addColorStop(0, `rgba(${this.r},${this.g},${this.b},1)`);
      g.addColorStop(0.35, `rgba(${this.r},${Math.max(0,this.g-50)},0,0.45)`);
      g.addColorStop(1, `rgba(160,0,0,0)`);
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size*4, 0, Math.PI*2);
      ctx.fillStyle = g; ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
      ctx.fillStyle = `rgb(${this.r},${this.g},${this.b})`; ctx.fill();
      ctx.restore();
    }
  }

  for (let i = 0; i < COUNT; i++) embers.push(new Ember(false));

  function animate() {
    ctx.clearRect(0, 0, W, H);
    for (const e of embers) {
      e.update(); e.draw();
      if (e.alpha <= 0 || e.y < -40 || e.x < -40 || e.x > W+40) e.reset(true);
    }
    requestAnimationFrame(animate);
  }
  animate();
</script>
