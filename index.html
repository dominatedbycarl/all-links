<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dominated By Carl | Official Links</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpg">
  <link rel="shortcut icon" type="image/jpeg" href="favicon.jpg">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { min-height:100%; width:100%; }

    body {
      min-height:100svh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
      background:#060000;
      color:#fff;
      overflow-x:hidden;
      padding:40px 16px;
      opacity:0;
      animation:body-in 0.6s ease forwards;
    }

    @keyframes body-in {
      to { opacity:1; }
    }

    .bg-layer {
      position:fixed; inset:0; z-index:0;
      background:
        radial-gradient(ellipse 90% 55% at 10% -5%, rgba(200,0,0,0.2) 0%, transparent 65%),
        radial-gradient(ellipse 70% 50% at 92% 105%, rgba(150,0,0,0.16) 0%, transparent 65%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(25,0,0,0.85) 0%, #060000 100%);
    }

    #ember-canvas {
      position:fixed; inset:0; z-index:1; pointer-events:none;
    }

    .container {
      position:relative;
      width:100%;
      text-align:center;
      padding:48px 30px 38px;
      background:
        linear-gradient(150deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.01) 45%, transparent 100%),
        rgba(8,0,0,0.6);
      border:1px solid rgba(255,80,80,0.22);
      border-radius:30px;
      backdrop-filter:blur(32px) saturate(170%) brightness(1.05);
      -webkit-backdrop-filter:blur(32px) saturate(170%) brightness(1.05);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 1.5px 0 0 rgba(255,200,200,0.13) inset,
        0 -1px 0 0 rgba(0,0,0,0.6) inset,
        0 0 50px rgba(255,10,10,0.14),
        0 0 120px rgba(180,0,0,0.07),
        0 50px 90px rgba(0,0,0,0.85);
      animation:card-in 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s both;
    }

    @keyframes card-in {
      from { transform:translateY(20px); opacity:0; }
      to { transform:translateY(0); opacity:1; }
    }

    .container::before {
      content:'';
      position:absolute; top:0; left:20px; right:20px; height:1px;
      background:linear-gradient(90deg, transparent, rgba(255,160,160,0.45), transparent);
      border-radius:100%;
    }

    .profile-wrap {
      position:relative; display:inline-block; margin-bottom:24px;
      animation:profile-in 0.7s cubic-bezier(0.22,1,0.36,1) 0.25s both;
    }

    @keyframes profile-in {
      from { transform:scale(0.9); opacity:0; }
      to { transform:scale(1); opacity:1; }
    }

    .profile-glow {
      position:absolute;
      inset:-28px;
      border-radius:50%;
      z-index:0;
      background:radial-gradient(circle, rgba(255,60,0,0.22) 0%, rgba(200,0,0,0.1) 45%, transparent 70%);
      animation:profile-glow-pulse 3.5s ease-in-out infinite;
    }

    @keyframes profile-glow-pulse {
      0%,100% { transform:scale(1); opacity:0.7; }
      50% { transform:scale(1.12); opacity:1; }
    }

    .energy-ring {
      position:absolute;
      inset:-6px;
      border-radius:50%;
      z-index:1;
      background:transparent;
      padding:2px;
    }

    .energy-ring::before {
      content:'';
      position:absolute;
      inset:0;
      border-radius:50%;
      background:conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(255,80,0,0.9) 40deg,
        rgba(255,30,0,1) 80deg,
        rgba(255,120,20,0.95) 120deg,
        rgba(255,50,0,0.85) 160deg,
        transparent 200deg,
        rgba(200,20,0,0.5) 240deg,
        rgba(255,70,10,0.8) 280deg,
        rgba(255,40,0,1) 320deg,
        transparent 360deg
      );
      animation:energy-spin 4s linear infinite;
      mask:radial-gradient(farthest-side, transparent calc(100% - 3px), black calc(100% - 3px));
      -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), black calc(100% - 3px));
    }

    .energy-ring::after {
      content:'';
      position:absolute;
      inset:-2px;
      border-radius:50%;
      background:conic-gradient(
        from 180deg,
        transparent 0deg,
        rgba(255,80,0,0.5) 40deg,
        rgba(255,30,0,0.6) 80deg,
        rgba(255,120,20,0.4) 120deg,
        transparent 200deg,
        rgba(255,50,0,0.4) 300deg,
        transparent 360deg
      );
      filter:blur(4px);
      animation:energy-spin 4s linear infinite;
    }

    @keyframes energy-spin {
      to { transform:rotate(360deg); }
    }

    .profile-image {
      position:relative; z-index:2;
      width:130px; height:130px;
      object-fit:cover; border-radius:50%;
      border:3px solid #080000;
      display:block;
    }

    h1 {
      font-size:clamp(1.6rem, 5.5vw, 2.2rem);
      font-weight:900;
      letter-spacing:0.06em;
      text-transform:uppercase;
      background:linear-gradient(135deg, #ffffff 0%, #ffdddd 30%, #ff6644 65%, #ff1100 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      margin-bottom:8px; line-height:1.1;
      text-shadow:none;
      filter:drop-shadow(0 0 18px rgba(255,50,0,0.45)) drop-shadow(0 2px 4px rgba(0,0,0,0.7));
      animation:name-in 0.6s ease 0.45s both;
    }

    @keyframes name-in {
      from { opacity:0; transform:translateY(6px); }
      to { opacity:1; transform:translateY(0); }
    }

    .description {
      color:rgba(255,160,160,0.5);
      margin-bottom:34px;
      font-size:0.88rem; letter-spacing:0.06em; text-transform:uppercase;
    }

    .links { display:flex; flex-direction:column; gap:13px; }

    .link {
      text-decoration:none; color:#fff;
      padding:16px 22px;
      border-radius:18px;
      font-size:1rem; font-weight:700; letter-spacing:0.025em;
      position:relative; overflow:hidden;
      display:flex; align-items:center; gap:12px;
      transition:
        transform 0.25s cubic-bezier(0.34,1.56,0.64,1),
        box-shadow 0.25s ease,
        border-color 0.25s ease,
        filter 0.25s ease;
      backdrop-filter:blur(12px) saturate(140%);
      -webkit-backdrop-filter:blur(12px) saturate(140%);
      opacity:0;
    }

    .link:nth-child(1) { animation:btn-in 0.5s cubic-bezier(0.22,1,0.36,1) 0.55s both; }
    .link:nth-child(2) { animation:btn-in 0.5s cubic-bezier(0.22,1,0.36,1) 0.68s both; }
    .link:nth-child(3) { animation:btn-in 0.5s cubic-bezier(0.22,1,0.36,1) 0.81s both; }
    .link:nth-child(4) { animation:btn-in 0.5s cubic-bezier(0.22,1,0.36,1) 0.94s both; }

    @keyframes btn-in {
      from { opacity:0; transform:translateY(14px); }
      to { opacity:1; transform:translateY(0); }
    }

    .link-shine {
      position:absolute;
      top:0; left:-120%; width:60%; height:100%;
      background:linear-gradient(105deg, transparent 20%, rgba(255,255,255,0.18) 50%, transparent 80%);
      transform:skewX(-18deg);
      pointer-events:none;
      transition:left 0s;
    }

    .link:hover .link-shine {
      left:160%;
      transition:left 0.45s ease;
    }

    .link::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:52%;
      background:linear-gradient(180deg, rgba(255,255,255,0.13) 0%, transparent 100%);
      border-radius:18px 18px 0 0;
      pointer-events:none;
    }

    .link::after {
      content:'';
      position:absolute; bottom:0; left:0; right:0; height:40%;
      background:linear-gradient(0deg, rgba(0,0,0,0.22) 0%, transparent 100%);
      border-radius:0 0 18px 18px;
      pointer-events:none;
    }

    .link:hover {
      transform:translateY(-3px);
    }

    .link:active { transform:translateY(-1px); }

    .link-text {
      flex:1;
    }

    .link-arrow {
      font-size:1rem;
      display:inline-block;
      transition:transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
      opacity:0.6;
    }

    .link:hover .link-arrow {
      transform:translateX(5px);
      opacity:1;
    }

    .twitch {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%),
        linear-gradient(135deg, rgba(55,25,90,0.92), rgba(130,60,255,0.88));
      border:1px solid rgba(145,70,255,0.35);
      box-shadow:0 4px 24px rgba(100,30,255,0.22), 0 0 0 1px rgba(255,255,255,0.04) inset;

    .twitch:hover {

    .instagram {

    .instagram:hover {

    .tiktok {

    .tiktok:hover {

    .link-icon {
      width:22px; height:22px;
      flex-shrink:0; display:flex; align-items:center; justify-content:center;
      transition:transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
    }
    .link-icon svg { width:22px; height:22px; fill:#fff; }
    .link:hover .link-icon { transform:scale(1.15); }

    .footer {
      margin-top:30px; font-size:0.7rem;
      color:rgba(255,80,80,0.2);
      letter-spacing:0.1em; text-transform:uppercase;
    }

    .orb {
      position:fixed; border-radius:50%;
      pointer-events:none; filter:blur(90px); z-index:0;
    }
    .orb-1 {
      width:520px; height:520px;
      background:rgba(190,0,0,0.13);
      top:-220px; left:-200px;
      animation:orb-drift 13s ease-in-out infinite alternate;
    }
    .orb-2 {
      width:440px; height:440px;
      background:rgba(110,0,0,0.11);
      bottom:-180px; right:-160px;
      animation:orb-drift 16s ease-in-out infinite alternate-reverse;
    }
    @keyframes orb-drift {
      0% { transform:translate(0,0); }
      100% { transform:translate(45px,45px); }
    }

    @media (max-width:480px) {
      body { padding:24px 10px; }
      #card-tilt { max-width:100%; }
      .container {
        padding:36px 20px 30px;
        border-radius:22px;
        border-left-color:transparent;
        border-right-color:transparent;
      }
      .profile-image { width:110px; height:110px; }
      .link {
        padding:18px 18px;
        font-size:0.95rem;
        min-height:64px;
      }
      .links { gap:14px; }
      h1 { margin-bottom:10px; }
      .description { margin-bottom:28px; }
    }

    @media (max-width:360px) {
      .container { border-radius:16px; }
    }

    /* ── Card tilt wrapper ── */
    #card-tilt {
      transform-style:preserve-3d;
      will-change:transform;
      position:relative; z-index:10;
      width:100%; max-width:460px;
    }

    /* ── Card breathe (inner) ── */
    @keyframes card-breathe {
      0%,100% { transform:scale(1.000); }
      50%      { transform:scale(1.004); }
    }
    .container {
      animation:card-in 0.7s cubic-bezier(0.22,1,0.36,1) 0.1s both,
                card-breathe 7s ease-in-out 1s infinite;
    }

    /* ── Vignette pulse ── */
    #vignette {
      position:fixed; inset:0; z-index:2; pointer-events:none;
      background:radial-gradient(ellipse 100% 100% at 50% 50%,
        transparent 40%, rgba(0,0,0,0.72) 100%);
      animation:vignette-pulse 4s ease-in-out infinite;
    }
    @keyframes vignette-pulse {
      0%,100% { opacity:0.7; }
      50%      { opacity:1.0; }
    }

    /* ── Name flicker ── */
    @keyframes name-glitch {
      0%   { opacity:1;    clip-path:none; }
      2%   { opacity:0.05; clip-path:inset(40% 0 40% 0); }
      4%   { opacity:1;    clip-path:none; transform:translateX(0); }
      5%   { opacity:0.2;  clip-path:inset(20% 0 60% 0); transform:translateX(-3px); }
      6%   { opacity:1;    clip-path:none; transform:translateX(0); }
      100% { opacity:1;    clip-path:none; }
    }
    h1.glitching {
      animation:name-glitch 0.18s steps(1) forwards;
    }

    /* ── Blood drip ── */
    #blood-drip {
      position:absolute;
      top:0; right:18px;
      width:3px; height:0;
      background:linear-gradient(180deg, #8b0000 0%, #cc0000 60%, transparent 100%);
      border-radius:0 0 4px 4px;
      z-index:20;
      opacity:0;
      pointer-events:none;
    }
    #blood-drip::after {
      content:'';
      position:absolute;
      bottom:-6px; left:-3px;
      width:9px; height:9px;
      background:#cc0000;
      border-radius:50% 50% 60% 60%;
      opacity:0.85;
    }
    @keyframes drip-grow {
      0%   { height:0;    opacity:0.9; }
      85%  { height:180px; opacity:0.85; }
      95%  { height:185px; opacity:0.6; }
      100% { height:185px; opacity:0; }
    }

    /* ── 3D tilt — handled via JS inline transform ── */

    /* ── Magnetic buttons — handled via JS ── */
    .link { transition:
      transform 0.25s cubic-bezier(0.34,1.56,0.64,1),
      box-shadow 0.25s ease,
      border-color 0.25s ease,
      filter 0.25s ease; }

    @media (prefers-reduced-motion:reduce) {
      .energy-ring::before,
      .energy-ring::after,
      .profile-glow,
      .orb { animation:none; }
      .container, body, h1, .link, .profile-wrap { animation:none; opacity:1; transform:none; }
      #vignette { animation:none; }
    }
  </style>
</head>

<script>
  // ─── Shared mouse state ───────────────────────────────────────────
  let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

  // ─── Ember canvas ─────────────────────────────────────────────────
  const canvas = document.getElementById('ember-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, embers = [];
  const isMobile = () => window.innerWidth < 480;
  const COUNT = () => isMobile() ? 38 : 55;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', () => { resize(); rebuildEmbers(); });

  function rand(a, b) { return a + Math.random() * (b - a); }

  class Ember {
    constructor(fromBottom) { this.reset(fromBottom); }
    reset(fromBottom) {
      const edgeBias = Math.random() < 0.6;
      this.x = edgeBias ? (Math.random() < 0.5 ? rand(0, W * 0.2) : rand(W * 0.8, W)) : rand(W * 0.15, W * 0.85);
      this.y = fromBottom ? H + rand(5, 50) : rand(H * 0.4, H + 60);
      this.large = Math.random() < 0.08;
      this.size = this.large ? rand(2.8, 4.5) : rand(0.6, 2.0);
      this.vx = rand(-0.4, 0.4);
      this.vy = this.large ? rand(-1.0, -0.4) : rand(-2.0, -0.6);
      this.alpha = rand(0.4, 0.9);
      this.decay = this.large ? rand(0.002, 0.005) : rand(0.004, 0.01);
      this.wobble = rand(0, Math.PI * 2);
      this.wobbleSpeed = rand(0.02, 0.055);
      this.wobbleAmp = rand(0.1, 0.6);
      this.trail = Math.random() < 0.28 && !this.large;
      this.history = [];
      const t = Math.random();
      if (t < 0.1) { this.r=255; this.g=240; this.b=180; }
      else if (t < 0.45) { this.r=255; this.g=rand(80,140); this.b=10; }
      else { this.r=255; this.g=rand(10,55); this.b=0; }
    }
    update() {
      if (this.trail) {
        this.history.push({ x: this.x, y: this.y, a: this.alpha });
        if (this.history.length > 6) this.history.shift();
      }
      this.wobble += this.wobbleSpeed;

      // ── Cursor repulsion: embers scatter away from mouse ──
      const dx = this.x - mouseX, dy = this.y - mouseY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const influence = 110;
      if (dist < influence && dist > 0) {
        const force = (1 - dist / influence) * 0.55;
        this.x += (dx / dist) * force;
        this.y += (dy / dist) * force;
      }

      this.x += this.vx + Math.sin(this.wobble) * this.wobbleAmp;
      this.y += this.vy;
      this.alpha -= this.decay;
      this.size *= 0.9985;
    }
    draw() {
      if (this.trail && this.history.length > 1) {
        for (let i = 0; i < this.history.length; i++) {
          const h = this.history[i];
          const t = i / this.history.length;
          ctx.save();
          ctx.globalAlpha = Math.max(0, h.a * t * 0.45);
          ctx.beginPath();
          ctx.arc(h.x, h.y, this.size * (0.3 + t * 0.5), 0, Math.PI * 2);
          ctx.fillStyle = `rgb(${this.r},${this.g},${this.b})`;
          ctx.fill();
          ctx.restore();
        }
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, this.alpha);
      const glowR = this.size * (this.large ? 5 : 3.5);
      const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowR);
      g.addColorStop(0, `rgba(${this.r},${this.g},${this.b},1)`);
      g.addColorStop(0.3, `rgba(${this.r},${Math.max(0,this.g-40)},0,0.35)`);
      g.addColorStop(1, `rgba(150,0,0,0)`);
      ctx.beginPath();
      ctx.arc(this.x, this.y, glowR, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgb(${this.r},${this.g},${this.b})`;
      ctx.fill();
      ctx.restore();
    }
  }

  function rebuildEmbers() {
    const c = COUNT();
    while (embers.length > c) embers.pop();
    while (embers.length < c) embers.push(new Ember(false));
  }
  rebuildEmbers();

  function animate() {
    ctx.clearRect(0, 0, W, H);
    for (const e of embers) {
      e.update();
      e.draw();
      if (e.alpha <= 0 || e.y < -60 || e.x < -60 || e.x > W + 60) e.reset(true);
    }
    requestAnimationFrame(animate);
  }
  animate();

  // ─── 3D card tilt ─────────────────────────────────────────────────
  const cardTilt = document.getElementById('card-tilt');
  let tiltX = 0, tiltY = 0;
  let targetTiltX = 0, targetTiltY = 0;
  const MAX_TILT = 9;

  function applyTilt() {
    tiltX += (targetTiltX - tiltX) * 0.08;
    tiltY += (targetTiltY - tiltY) * 0.08;
    cardTilt.style.transform = `perspective(900px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    requestAnimationFrame(applyTilt);
  }

  window.addEventListener('mousemove', e => {
    if (isMobile()) return;
    const rect = cardTilt.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (e.clientX - cx) / (window.innerWidth / 2);
    const dy = (e.clientY - cy) / (window.innerHeight / 2);
    targetTiltY =  dx * MAX_TILT;
    targetTiltX = -dy * MAX_TILT;
  });

  window.addEventListener('mouseleave', () => {
    targetTiltX = 0;
    targetTiltY = 0;
  });

  applyTilt();

  // ─── Magnetic buttons ─────────────────────────────────────────────
  // Note: previously this loop wrote an inline `transform` on every single
  // animation frame — including frames where the offset was (0,0). That
  // inline style has higher priority than CSS, so it silently cancelled
  // the button's entrance slide-in animation and the CSS hover/active
  // lift the whole time. Now we only set an inline transform while the
  // magnet pull or a hover/press lift is actually non-zero, and clear it
  // otherwise so CSS (entrance animation, :hover, :active) can do its job.
  document.querySelectorAll('.link').forEach(btn => {
    const RADIUS = 90, STRENGTH = 0.38;
    let bx = 0, by = 0, active = false;
    let hovering = false, pressed = false;

    btn.addEventListener('mouseenter', () => { hovering = true; });
    btn.addEventListener('mouseleave', () => { hovering = false; });
    btn.addEventListener('mousedown', () => { pressed = true; });
    btn.addEventListener('mouseup', () => { pressed = false; });
    btn.addEventListener('touchstart', () => { pressed = true; }, { passive: true });
    btn.addEventListener('touchend', () => { pressed = false; });

    function magnetLoop() {
      if (!active) {
        bx += (0 - bx) * 0.12;
        by += (0 - by) * 0.12;
      }
      const lift = pressed ? -1 : (hovering ? -3 : 0);

      if (Math.abs(bx) > 0.05 || Math.abs(by) > 0.05 || lift !== 0) {
        btn.style.transform = `translate(${bx}px, ${by + lift}px)`;
      } else if (btn.style.transform) {
        btn.style.transform = '';
      }
      requestAnimationFrame(magnetLoop);
    }
    magnetLoop();

    window.addEventListener('mousemove', e => {
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < RADIUS) {
        active = true;
        const pull = (1 - dist / RADIUS) * STRENGTH;
        bx += (dx * pull - bx) * 0.18;
        by += (dy * pull - by) * 0.18;
      } else {
        active = false;
      }
    });
  });

  // ─── Name flicker (rare, every 20–30s) ────────────────────────────
  const h1 = document.querySelector('h1');
  function scheduleFlicker() {
    const delay = rand(20000, 30000);
    setTimeout(() => {
      h1.classList.add('glitching');
      h1.addEventListener('animationend', () => {
        h1.classList.remove('glitching');
        scheduleFlicker();
      }, { once: true });
    }, delay);
  }
  scheduleFlicker();

  // ─── Blood drip ───────────────────────────────────────────────────
  const drip = document.getElementById('blood-drip');

  function runDrip() {
    drip.style.animation = 'none';
    drip.style.opacity = '0';
    drip.style.height = '0';
    // Force reflow
    void drip.offsetWidth;
    drip.style.animation = 'drip-grow 3.8s cubic-bezier(0.4,0,0.6,1) forwards';
    drip.addEventListener('animationend', () => {
      drip.style.opacity = '0';
      scheduleDrip();
    }, { once: true });
  }

  function scheduleDrip() {
    // On small screens: every 18–28s. Easter egg on desktop: every 45–90s
    const delay = isMobile() ? rand(18000, 28000) : rand(45000, 90000);
    setTimeout(runDrip, delay);
  }

  scheduleDrip();
</script>
</body>
</html>
